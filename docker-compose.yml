services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcpemail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcpemail}
      POSTGRES_DB: ${POSTGRES_DB:-mcpemail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpemail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mcpemail}:${POSTGRES_PASSWORD:-mcpemail}@db:5432/${POSTGRES_DB:-mcpemail}
    ports:
      - "${APP_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
